<!doctype html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ZDI Point Calc 2026</title>
	<style>
		:root {
			--bg: #090f1a;
			--bg-soft: #0f1828;
			--surface: #182337;
			--surface-2: #141f31;
			--ink: #eef4ff;
			--muted: #a2b3c9;
			--ok: #43d4a8;
			--no: #f27474;
			--warn: #ff8c8c;
			--accent: #8ccfff;
			--ring: rgba(140, 207, 255, 0.42);
			--line: rgba(255, 255, 255, 0.08);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			height: 100%;
			overflow: hidden;
		}

		body {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr) auto;
			height: 100dvh;
			position: relative;
			isolation: isolate;
			color: var(--ink);
			color-scheme: dark;
			font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
			background: #0a111d;
		}

		body::before {
			content: "";
			position: fixed;
			inset: -20%;
			pointer-events: none;
			z-index: -1;
			background:
				radial-gradient(38% 42% at 14% 9%, rgba(126, 170, 255, 0.2), transparent 72%),
				radial-gradient(30% 34% at 86% 78%, rgba(110, 230, 190, 0.12), transparent 68%),
				radial-gradient(34% 38% at 66% 24%, rgba(230, 170, 255, 0.1), transparent 72%);
			filter: blur(14px);
		}

		.top-bar {
			padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
			background: rgba(15, 24, 40, 0.74);
			backdrop-filter: blur(10px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.04);
			display: grid;
			gap: 6px;
			box-shadow: 0 6px 18px rgba(2, 8, 16, 0.25);
		}

		.top-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.score-big {
			font-size: clamp(1.2rem, 3.5vw, 1.7rem);
			font-weight: 800;
			line-height: 1;
		}

		.row-index {
			font-size: 0.86rem;
			color: var(--muted);
		}

		.stats {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			font-size: 0.88rem;
			color: var(--muted);
		}

		.stats span {
			background: rgba(24, 35, 55, 0.68);
			border-radius: 999px;
			padding: 3px 8px;
		}

		.stats b {
			color: var(--ink);
		}

		.controls {
			display: flex;
			gap: 8px;
			align-items: center;
			flex-wrap: wrap;
		}

		.controls label {
			font-size: 0.88rem;
			color: var(--muted);
		}

		.controls input {
			width: 78px;
			margin-left: 6px;
			border-radius: 8px;
			border: 0;
			background: rgba(20, 31, 49, 0.88);
			color: var(--ink);
			padding: 6px 8px;
			font-size: 0.95rem;
			font-family: "IBM Plex Mono", "Consolas", monospace;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
		}

		.action {
			border: 0;
			border-radius: 10px;
			padding: 6px 9px;
			cursor: pointer;
			font-weight: 700;
			font-family: inherit;
			background: rgba(22, 34, 54, 0.86);
			color: var(--ink);
			transition: background-color 120ms ease, transform 120ms ease;
		}

		.action:hover {
			background: rgba(33, 49, 74, 0.94);
			transform: translateY(-1px);
		}

		.controls input:focus-visible,
		.action:focus-visible,
		.bottom-bar button:focus-visible,
		.line:focus-visible {
			outline: none;
			box-shadow:
				0 0 0 1.5px var(--ring),
				0 0 0 5px rgba(140, 207, 255, 0.1);
		}

		.auto-bonus {
			font-size: 0.8rem;
			line-height: 1.35;
			color: #b5d1e6;
			border-radius: 10px;
			background: rgba(22, 34, 54, 0.62);
			padding: 6px 8px;
		}

		.line-list {
			min-height: 0;
			margin: 0;
			padding: 8px;
			list-style: none;
			display: grid;
			gap: 6px;
			overflow-y: auto;
			overflow-x: hidden;
			background: transparent;
			scrollbar-width: thin;
			scrollbar-color: #3f6284 transparent;
		}

		.line-list::-webkit-scrollbar {
			width: 8px;
		}

		.line-list::-webkit-scrollbar-track {
			background: transparent;
		}

		.line-list::-webkit-scrollbar-thumb {
			background: #3b6484;
			border-radius: 999px;
		}

		.line {
			display: grid;
			grid-template-columns: 68px 1fr auto;
			align-items: center;
			gap: 8px;
			border: 0;
			border-radius: 12px;
			background: rgba(20, 31, 49, 0.72);
			padding: 9px;
			cursor: pointer;
			user-select: none;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
			backdrop-filter: blur(3px);
		}

		.line.current {
			background: rgba(27, 43, 66, 0.86);
			box-shadow:
				0 0 0 1px rgba(140, 207, 255, 0.16),
				0 10px 20px rgba(0, 0, 0, 0.22);
		}

		.state {
			text-align: center;
			border-radius: 999px;
			padding: 4px 8px;
			font-size: 0.74rem;
			font-weight: 800;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: #afc6dd;
			background: rgba(34, 51, 74, 0.84);
		}

		.state.ok {
			border-color: color-mix(in srgb, var(--ok) 58%, #1a3144);
			color: #051f18;
			background: color-mix(in srgb, var(--ok) 80%, #1a3144);
		}

		.state.no {
			border-color: color-mix(in srgb, var(--no) 55%, #1a3144);
			color: #2f0303;
			background: color-mix(in srgb, var(--no) 72%, #1a3144);
		}

		.line-title {
			font-size: 0.9rem;
			line-height: 1.35;
			color: #deefff;
		}

		.line-points {
			font-weight: 800;
			font-size: 0.88rem;
			color: #8dd6ff;
			min-width: 50px;
			text-align: right;
			font-family: "IBM Plex Mono", "Consolas", monospace;
		}

		.line-points.minus {
			color: var(--warn);
		}

		.bottom-bar {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
			padding: 8px max(8px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right));
			background: rgba(15, 24, 40, 0.76);
			backdrop-filter: blur(10px);
			border-top: 1px solid rgba(255, 255, 255, 0.04);
			box-shadow: 0 -6px 18px rgba(2, 8, 16, 0.25);
		}

		.bottom-bar button {
			border: 0;
			border-radius: 10px;
			padding: 12px 10px;
			font-family: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
			transition: filter 120ms ease, transform 120ms ease;
		}

		.bottom-bar button:hover {
			filter: brightness(1.05);
			transform: translateY(-1px);
		}

		.bottom-bar button:active {
			filter: brightness(0.95);
		}

		#btnNo {
			background: var(--no);
			color: #340708;
		}

		#btnYes {
			background: var(--ok);
			color: #063024;
		}

		@media (min-width: 900px) {
			body {
				max-width: 920px;
				margin: 0 auto;
				box-shadow: 0 0 0 1px var(--line);
			}
		}
	</style>
</head>
<body>
	<section class="top-bar" aria-live="polite">
		<div class="top-row">
			<div class="score-big">Punkte: <span id="scoreBig">0</span> / 530</div>
			<div id="rowIndex" class="row-index">Zeile 1/1</div>
		</div>

		<div class="stats">
			<span>Aufgaben: <b id="taskPoints">0</b></span>
			<span>Bonus 3C: <b id="bonusPoints">0</b></span>
			<span>Beruehrungsabzug: <b id="touchPenalty">0</b></span>
			<span>Netto: <b id="netPoints">0</b></span>
		</div>

		<div class="controls">
			<label for="touchCount">Beruehrungen</label>
			<input id="touchCount" type="number" min="0" step="1" value="0" inputmode="numeric">
			<button id="focusStart" class="action" type="button">Start</button>
			<button id="resetAll" class="action" type="button">Reset</button>
		</div>

		<div id="autoBonusInfo" class="auto-bonus">
			Bonus Aufgabe 3C: Wird automatisch vergeben, wenn Erdantenne und Weltallantenne beide auf <strong>rot</strong> stehen.
		</div>
	</section>

	<ul id="lineList" class="line-list" aria-label="Aufgaben-Checkliste"></ul>

	<section class="bottom-bar" aria-label="Antwortleiste">
		<button id="btnNo" type="button">NEIN (Space)</button>
		<button id="btnYes" type="button">JA (Enter)</button>
	</section>

	<script>
		const defaultSolvedIds = new Set([
			"12_BARRIER_BASE",
			"12_BARRIER_A",
			"12_BARRIER_B"
		]);

		const items = [
			{ id: "1A_ROCKET", label: "1A Rakete vollständig/aufrecht im roten Bereich der Startrampe", points: 15 },
			{ id: "1A_BASE", label: "1A Unterbau vollständig/aufrecht im roten Bereich der Startrampe", points: 15 },
			{ id: "1A_STACK", label: "1A Rakete auf Unterbau, beides vollständig im roten Bereich", points: 10 },
			{ id: "1B_FUEL_1", label: "1B Treibstoffelement 1 vollständig im roten Bereich der Startrampe", points: 11 },
			{ id: "1B_FUEL_2", label: "1B Treibstoffelement 2 vollständig im roten Bereich der Startrampe", points: 11 },
			{ id: "1C_LEVER", label: "1C Roter Hebel herausgezogen, rote Markierung berührt", points: 17 },

			{ id: "2A_BUS", label: "2A Schulbus berührt roten Bereich der Sternwarte (aufrecht)", points: 18 },
			{ id: "2B_RED", label: "2B Erdantenne: rot", points: 22, group: "EARTH_ANTENNA" },
			{ id: "2B_MID", label: "2B Erdantenne: gelb oder grün", points: 17, group: "EARTH_ANTENNA" },

			{ id: "3A_SAT_1", label: "3A Satellit 1 vollständig im lila Satellitenbereich", points: 13 },
			{ id: "3A_SAT_2", label: "3A Satellit 2 vollständig im lila Satellitenbereich", points: 13 },
			{ id: "3B_RED", label: "3B Weltallantenne: rot", points: 22, group: "SPACE_ANTENNA" },
			{ id: "3B_MID", label: "3B Weltallantenne: gelb oder grün", points: 17, group: "SPACE_ANTENNA" },

			{ id: "4_DEBRIS_1", label: "4 Trümmerteil 1 vollständig in Draufsicht in Base", points: 13 },
			{ id: "4_DEBRIS_2", label: "4 Trümmerteil 2 vollständig in Draufsicht in Base", points: 13 },

			{ id: "5_PERFECT", label: "5 Zwischen Pfosten ins Weltall, Matte verlassen (27)", points: 27, group: "TASK5" },
			{ id: "5_BALL_DROP", label: "5 Wie oben, aber Ball/Bälle heruntergefallen (13)", points: 13, group: "TASK5" },

			{ id: "6_BLUE", label: "6 Farbklotz vollständig im Wetterbereich blau", points: 14 },
			{ id: "6_YELLOW", label: "6 Farbklotz vollständig im Wetterbereich gelb", points: 14 },
			{ id: "6_GREEN", label: "6 Farbklotz vollständig im Wetterbereich grün", points: 14 },

			{ id: "7A_BLOCK_1", label: "7A Materialblock 1 vollständig im schwarzen Experimentbereich", points: 13 },
			{ id: "7A_BLOCK_2", label: "7A Materialblock 2 vollständig im schwarzen Experimentbereich", points: 13 },
			{ id: "7B_EXPERIMENT", label: "7B Ball am unteren Ende des Experiments", points: 20 },

			{ id: "8_CAPSULE", label: "8 Rückkehrkapsel unbeschadet und vollständig in Base", points: 25 },
			{ id: "9_ROVER", label: "9 Rover vollständig/aufrecht im dunkelblauen Bereich", points: 35 },

			{ id: "10_SAMPLE_1", label: "10 Probe 1 vollständig in Draufsicht in Base", points: 35 },
			{ id: "10_SAMPLE_2", label: "10 Probe 2 vollständig in Draufsicht in Base", points: 35 },

			{ id: "11_ZONE_1", label: "11 Markierungsblock vollständig in hellgrünem Landebereich 1", points: 11 },
			{ id: "11_ZONE_2", label: "11 Markierungsblock vollständig in hellgrünem Landebereich 2", points: 11 },
			{ id: "11_ZONE_3", label: "11 Markierungsblock vollständig in hellgrünem Landebereich 3", points: 11 },
			{ id: "11_ZONE_4", label: "11 Markierungsblock vollständig in hellgrünem Landebereich 4", points: 11 },

			{ id: "12_BARRIER_BASE", label: "12 Barriere bei Base nicht verschoben/beschädigt", points: 11 },
			{ id: "12_BARRIER_A", label: "12 Barriere neben Terrain A nicht verschoben/beschädigt", points: 11 },
			{ id: "12_BARRIER_B", label: "12 Barriere neben Terrain B nicht verschoben/beschädigt", points: 11 },

			{ id: "PENALTY_FAIR", label: "Verstoß gegen Fairnessgebot (Abzug 100)", points: -100 }
		].map((item) => ({ ...item, checked: defaultSolvedIds.has(item.id) }));

		const lineList = document.getElementById("lineList");
		const rowIndex = document.getElementById("rowIndex");
		const scoreBig = document.getElementById("scoreBig");
		const taskPoints = document.getElementById("taskPoints");
		const bonusPoints = document.getElementById("bonusPoints");
		const touchPenalty = document.getElementById("touchPenalty");
		const netPoints = document.getElementById("netPoints");
		const autoBonusInfo = document.getElementById("autoBonusInfo");
		const touchCountInput = document.getElementById("touchCount");
		const focusStart = document.getElementById("focusStart");
		const resetAll = document.getElementById("resetAll");
		const btnNo = document.getElementById("btnNo");
		const btnYes = document.getElementById("btnYes");
		const isCoarsePointer = window.matchMedia("(pointer: coarse)").matches;

		let currentIndex = 0;
		let manualScrollOverride = false;

		function formatPoints(value) {
			return value > 0 ? `+${value}` : `${value}`;
		}

		function renderList() {
			lineList.innerHTML = "";

			items.forEach((item, idx) => {
				const row = document.createElement("li");
				row.className = "line";
				row.tabIndex = -1;
				row.dataset.index = String(idx);

				const state = document.createElement("span");
				state.className = `state ${item.checked ? "ok" : "no"}`;
				state.textContent = item.checked ? "JA" : "NEIN";

				const title = document.createElement("span");
				title.className = "line-title";
				title.textContent = item.label;

				const pts = document.createElement("span");
				pts.className = `line-points ${item.points < 0 ? "minus" : ""}`;
				pts.textContent = formatPoints(item.points);

				row.append(state, title, pts);

				row.addEventListener("click", () => {
					currentIndex = idx;
					setAnswer(!items[idx].checked, false);
				});

				row.addEventListener("contextmenu", (event) => {
					event.preventDefault();
					currentIndex = idx;
					setAnswer(false, false);
				});

				lineList.appendChild(row);
			});

			updateCurrentVisual();
			updateScore();
		}

		function getAutoBonus3C() {
			const earthRed = items.find((item) => item.id === "2B_RED").checked;
			const spaceRed = items.find((item) => item.id === "3B_RED").checked;
			return earthRed && spaceRed ? 15 : 0;
		}

		function getTouchPenalty() {
			const touches = Math.max(0, Number.parseInt(touchCountInput.value || "0", 10) || 0);
			return touches * 10;
		}

		function getTaskPoints() {
			let points = 0;
			const groupedMax = new Map();

			for (const item of items) {
				if (!item.checked) {
					continue;
				}

				if (item.group) {
					const prev = groupedMax.get(item.group);
					if (prev === undefined || item.points > prev) {
						groupedMax.set(item.group, item.points);
					}
				} else {
					points += item.points;
				}
			}

			for (const value of groupedMax.values()) {
				points += value;
			}

			return points;
		}

		function updateScore() {
			const points = getTaskPoints();

			const bonus = getAutoBonus3C();
			const touchesPenalty = getTouchPenalty();
			const total = points + bonus - touchesPenalty;

			taskPoints.textContent = String(points);
			bonusPoints.textContent = String(bonus);
			touchPenalty.textContent = `-${touchesPenalty}`;
			netPoints.textContent = String(total);
			scoreBig.textContent = String(total);

			autoBonusInfo.innerHTML = bonus > 0
				? "<strong>Bonus Aufgabe 3C aktiv:</strong> Beide Antennen stehen auf rot. <strong>+15 Punkte</strong>."
				: "<strong>Bonus Aufgabe 3C:</strong> Wird automatisch vergeben, wenn Erdantenne und Weltallantenne beide auf <strong>rot</strong> stehen.";
		}

		function updateCurrentVisual() {
			const rows = lineList.querySelectorAll(".line");
			rows.forEach((row, idx) => {
				row.classList.toggle("current", idx === currentIndex);
			});
			rowIndex.textContent = `Zeile ${currentIndex + 1}/${items.length}`;
		}

		function centerCurrentInView(behavior = "smooth") {
			if (manualScrollOverride) {
				return;
			}

			const row = lineList.querySelector(`.line[data-index="${currentIndex}"]`);
			if (!row) {
				return;
			}

			const listRect = lineList.getBoundingClientRect();
			const rowRect = row.getBoundingClientRect();
			const rowCenter = (rowRect.top - listRect.top) + lineList.scrollTop + (rowRect.height / 2);
			const targetTop = rowCenter - (lineList.clientHeight / 2);
			const maxTop = Math.max(0, lineList.scrollHeight - lineList.clientHeight);
			const nextTop = Math.max(0, Math.min(maxTop, targetTop));

			lineList.scrollTo({ top: nextTop, behavior });
		}

		function focusCurrent(scrollBehavior = "smooth") {
			const row = lineList.querySelector(`.line[data-index="${currentIndex}"]`);
			if (row) {
				if (!isCoarsePointer) {
					try {
						row.focus({ preventScroll: true });
					} catch {
						row.focus();
					}
				}
				centerCurrentInView(scrollBehavior);

				// Some mobile browsers still adjust scroll after layout changes.
				if (isCoarsePointer) {
					requestAnimationFrame(() => centerCurrentInView("auto"));
				}
			}
			updateCurrentVisual();
		}

		function move(delta) {
			currentIndex = Math.max(0, Math.min(items.length - 1, currentIndex + delta));
			focusCurrent();
		}

		function setAnswer(value, moveNext = true) {
			const current = items[currentIndex];
			current.checked = value;
			manualScrollOverride = false;

			renderList();

			if (moveNext && currentIndex < items.length - 1) {
				currentIndex += 1;
			}

			focusCurrent();
		}

		document.addEventListener("keydown", (event) => {
			const active = document.activeElement;

			if (active === touchCountInput) {
				if (event.key === "ArrowUp" || event.key === "ArrowDown") {
					setTimeout(updateScore, 0);
				}
				return;
			}

			if (!(active instanceof HTMLElement) || !active.classList.contains("line")) {
				return;
			}

			if (event.key === "ArrowDown") {
				event.preventDefault();
				move(1);
				return;
			}

			if (event.key === "ArrowUp") {
				event.preventDefault();
				move(-1);
				return;
			}

			if (event.key === "Enter") {
				event.preventDefault();
				setAnswer(true, true);
				return;
			}

			if (event.key === " " || event.code === "Space") {
				event.preventDefault();
				setAnswer(false, true);
			}
		});

		lineList.addEventListener("wheel", () => {
			manualScrollOverride = true;
		}, { passive: true });

		lineList.addEventListener("touchmove", () => {
			manualScrollOverride = true;
		}, { passive: true });

		lineList.addEventListener("pointerdown", (event) => {
			if (!(event.target instanceof Element) || !event.target.closest(".line")) {
				manualScrollOverride = true;
			}
		});

		touchCountInput.addEventListener("input", () => {
			const raw = touchCountInput.value;
			if (raw === "") {
				updateScore();
				return;
			}

			const n = Number.parseInt(raw, 10);
			if (Number.isNaN(n) || n < 0) {
				touchCountInput.value = "0";
			}

			updateScore();
		});

		focusStart.addEventListener("click", () => {
			currentIndex = 0;
			focusCurrent();
		});

		resetAll.addEventListener("click", () => {
			for (const item of items) {
				item.checked = defaultSolvedIds.has(item.id);
			}
			touchCountInput.value = "0";
			manualScrollOverride = false;
			currentIndex = 0;
			renderList();
			focusCurrent();
		});

		btnYes.addEventListener("click", () => {
			setAnswer(true, true);
		});

		btnNo.addEventListener("click", () => {
			setAnswer(false, true);
		});

		renderList();
		focusCurrent("auto");
	</script>
</body>
</html>
